<!-- Subscription.html -->

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylesheets/styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subscription Plans</title>
  <style>
    
body {
    background-color: #1b1b1b;
    color: #fff;
    font-family: product;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

.pricing-container {
    text-align: center;
    animation: fadeIn 1s ease-in-out;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.pricing-title {
    margin-bottom: 20px;
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: 2px;
    display: flex;
    flex-direction: column;
}

.pricing-title span {
    font-size: 1.2rem;
    font-weight: 400;
    margin-top: 10px;
    color: #8583fd;
}

.plans {
    display: flex;
    justify-content: space-around;
    gap: 20px;
    margin-top: 20px;
}

.plan {
    background-color: #282828;
    padding: 25px;
    border-radius: 12px;
    width: 270px;
    text-align: center;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
}

.plan:hover {
    transform: scale(1.08);
    box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
}

.featured {
    border: 2px solid #8b5cf7;
    background: linear-gradient(145deg, #282828, #1e1e1e);
}

.price {
    font-size: 1.8rem;
    margin: 15px 0;
    font-weight: 600;
}

.features {
    list-style-type: none;
    padding: 0;
    font-weight: 400;
}

.features li {
    margin: 10px 0;
    position: relative;
    padding-left: 20px;
}

.features li::before {
    content: "✔";
    position: absolute;
    left: 0;
    color: #865aee;
    font-size: 1rem;
}

.btn {
    background-color: #6153dd;
    color: #f3e9e9;
    padding: 10px 25px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    transition: background-color 0.3s ease, transform 0.3s ease;
    margin-top: 15px;
}

.btn:hover {
    background-color: #5933e4;
    transform: translateY(-2px);
}

body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: -1;
}

.plan::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.1);
    z-index: -1;
    transition: opacity 0.3s ease;
}

.plan:hover::after {
    opacity: 0;
}

.pricing-title::after {
    content: "";
    display: block;
    width: 50px;
    height: 4px;
    background: #8583fd;
    margin: 10px auto 0;
}

.plan .price::before {
    content: "₹";
    font-size: 1rem;
    vertical-align: super;
    margin-right: 5px;
}

.plan .price::after {
    content: "/mo";
    font-size: 1rem;
    vertical-align: sub;
    margin-left: 5px;
}

.features li::after {
    content: "";
    display: block;
    width: 10px;
    height: 10px;
    background: #865aee;
    border-radius: 50%;
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
}

.btn:active {
    transform: translateY(0);
}

.plan .btn {
    width: 100%;
    padding: 15px 0;
}

.plan .btn:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(133, 90, 238, 0.5);
}

.plan .btn:disabled {
    background-color: #ccc;
    cursor: not-allowed;
}

.plan .btn:disabled:hover {
    transform: none;
}

.plan .btn:disabled:active {
    transform: none;
}

.plan .btn:disabled:focus {
    box-shadow: none;
}

.plan .btn:disabled:before {
    content: "Unavailable";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
}

.plan .btn:disabled:after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1;
}

.plan .btn:disabled:hover:before {
    color: #ccc;
}

.plan .btn:disabled:hover:after {
    background: rgba(0, 0, 0, 0.7);
}

.plan .btn:disabled:active:before {
    color: #999;
}

.plan .btn:disabled:active:after {
    background: rgba(0, 0, 0, 0.9);
}

.plan .btn:disabled:focus:before {
    color: #666;
}

.plan .btn:disabled:focus:after {
    background: rgba(0, 0, 0, 1);
}

  </style>
</head>
<body>
  <div class="pricing-container">
    <h1 class="pricing-title">Gradians AI<span>Choose Your Plan</span></h1>
    <div class="plans">
      <div class="plan">
        <h2>Basic</h2>
        <p class="price">149</p>
        <ul class="features">
          <li>Grading Notebooks</li>
          <li>1 Month Validity</li>
        </ul>
        <button class="btn" onclick="payNow(149, 'Basic')">Subscribe</button>
      </div>
      <div class="plan">
        <h2>Standard</h2>
        <p class="price">499</p>
        <ul class="features">
          <li>Grading Notebooks</li>
          <li>Customized Feedbacks</li>
          <li>6 Months Validity</li>
        </ul>
        <button class="btn" onclick="payNow(499, 'Standard')">Subscribe</button>
      </div>
      <div class="plan featured">
        <h2>Premium</h2>
        <p class="price">999</p>
        <ul class="features">
          <li>Grading Notebooks</li>
          <li>Handwriting Feedbacks</li>
          <li>Latest Gemini 1.5 Flash</li>
          <li>1 yr validity</li>
        </ul>
        <button class="btn" onclick="payNow(999, 'Premium')">Subscribe</button>
      </div>
    </div>
  </div>
<!--The APP's SUBSCRIPTION-->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js"></script>
  <script>
  const firebaseConfig = {
  apiKey: "AIzaSyCyiN8rCLivNQe9SXAZZzC26_oWrcXvZtE",
  authDomain: "gradian-ai.firebaseapp.com",
  projectId: "gradian-ai",
  storageBucket: "gradian-ai.appspot.com",
  messagingSenderId: "578027234132",
  appId: "1:578027234132:web:1fbd792f445d1302495ec1",
  measurementId: "G-FRKDDRQ09S"
};
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();
    function payNow(amount, plan) {
      var options = {
        "key": "rzp_test_dirVSGqdW8GIoq",
        "amount": amount * 100,
        "currency": "INR",
        "name": "Gradians AI",
        "description": plan + " Plan Subscription",
        "handler": function (response) {
          alert("Payment successful! Payment ID: " + response.razorpay_payment_id);
          updateSubscription(plan); 
        },
      };
      var rzp1 = new Razorpay(options);
      rzp1.open();
    }
    function updateSubscription(plan) {
      var user = firebase.auth().currentUser;
      if (user) {
        var userId = user.uid;
        db.collection('users').doc(userId).set({
          subscription: plan,
          subscribedOn: firebase.firestore.FieldValue.serverTimestamp()
        })
        .then(function() {
          alert("Subscription updated successfully!");
          window.location.href = "index.html"; 
        })
        .catch(function(error) {
          console.error("Error updating subscription: ", error);
        });
      }
    }
  </script>
</body>
</html>
