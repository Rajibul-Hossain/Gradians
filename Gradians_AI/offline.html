<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @font-face {
            font-family: product;
            src: url("product.ttf");
        }
        body {
            font-family: 'product', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
            overflow: hidden;
        }
        .container {
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .icon {
            font-size: 5em;
            margin-bottom: 20px;
            color: #e74c3c;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        h1 {
            font-size: 2.8em;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.3em;
            margin-bottom: 25px;
        }
        a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.2em;
            padding: 10px 20px;
            border: 2px solid #3498db;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
        }
        a:hover {
            background-color: #3498db;
            color: #ffffff;
        }
        footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.9em;
            color: #7f8c8d;
        }


        .img {
            max-width: 250px; 
            height: auto;
            margin-bottom: 0px; 
        }

        @media (max-width: 768px) {
            img {
                max-width: 120px; 
            }
        }

    </style>
</head>
<body>
    <img id ="img" src="logo.svg" alt="Logo">
    <div class="container">
        <i class="fas fa-wifi-slash icon"></i>
        <h1>Oops! You're Offline</h1>
        <p>We can't reach the server. Please check your internet connection and try again.</p>
        <a href="javascript:location.reload();">Retry</a>
    </div>
    <footer>
    </footer>
</body>
</html>
